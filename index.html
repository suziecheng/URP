<!DOCTYPE html>
<html>
<head>
  <title>NYC Chinatown Connectivity Index</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

  <style>
    #map {
      height: 100vh;
    }
  </style>
</head>
<body>

<div id="map"></div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
  const map = L.map('map').setView([40.73, -73.93], 11);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19
  }).addTo(map);

  const files = ['NTA2020.geojson', 'L1.geojson', 'L2.geojson', 'L3.geojson', 'shadowtransit.geojson'];

  const colors = {
    L1: 'yellow',
    L2: 'orange',
    L3: 'red',
    shadow: 'purple'
  };

  function styleLayer(level) {
    return {
      color: colors[level],
      weight: level === 'shadow' ? 2 : 4,
      fillColor: colors[level],
      fillOpacity: 0.6
    };
  }

  
  files.forEach(file => {
    const level = file.includes('L1') ? 'L1' :
                  file.includes('L2') ? 'L2' :
                  file.includes('L3') ? 'L3' :
                  'shadow';

    fetch(file)
      .then(response => response.json())
      .then(data => {
        L.geoJSON(data, {
          pointToLayer: (feature, latlng) =>
            level !== 'shadow' ? L.circleMarker(latlng, styleLayer(level)) : undefined,
          style: level === 'shadow' ? styleLayer(level) : undefined
        }).addTo(map);
      });
  });
</script>

</body>
</html>
