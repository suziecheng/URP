<!DOCTYPE html>
<html>
<head>
  <title>NYC Chinatown Connectivity Index</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

  <style>
    #map {
      height: 100vh;
    }
  </style>
</head>
<body>

<div id="map"></div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
  const map = L.map('map').setView([40.73, -73.93], 11);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19
  }).addTo(map);

  function getColor(pct) {
    return pct > 50 ? "#800026" :
           pct > 30 ? "#BD0026" :
           pct > 20 ? "#E31A1C" :
           pct > 10 ? "#FC4E2A" :
           pct > 5  ? "#FD8D3C" :
           pct > 0  ? "#FEB24C" :
                      "#FFEDA0";
  }

  
  const layerGroups = {
      density: L.layerGroup().addTo(map),
      L1: L.layerGroup().addTo(map),
      L2: L.layerGroup().addTo(map),
      L3: L.layerGroup().addTo(map),
      vans: L.layerGroup().addTo(map)
  };

  const overlays = {
      "Chinese Population Density": layerGroups.density,
      "Level 1 (Individual Shops)": layerGroups.L1,
      "Level 2 (Community Infra)": layerGroups.L2,
      "Level 3 (Institutional Infra)": layerGroups.L3,
      "Dollar Vans": layerGroups.vans
    };
    L.control.layers(null, overlays, { collapsed: false }).addTo(map);


fetch("NTA2020.geojson")
      .then(res => res.json())
      .then(data => {
        L.geoJSON(data, {
          style: feature => ({
            fillColor: getColor(feature.properties.chinese_pct),
            fillOpacity: 0.6,
            color: "#999",
            weight: 0.5
          }),
          onEachFeature: (feature, layer) => {
            const name = feature.properties.NTAName;
            const pct = feature.properties.chinese_pct?.toFixed(1) ?? "N/A";
            layer.bindPopup(`<strong>${name}</strong><br>Chinese %: ${pct}%`);
          }
        }).addTo(layerGroups.density);
      });

  fetch("L1.geojson")
      .then(res => res.json())
      .then(data => {
        L.geoJSON(data, {
          pointToLayer: (feature, latlng) =>
            L.circleMarker(latlng, {
              radius: 5,
              fillColor: "yellow",
              fillOpacity: 0.8,
              color: "#000",
              weight: 1
            }).bindPopup(feature.properties.Business_Name)
        }).addTo(layerGroups.L1);
      });

  fetch("L2.geojson")
      .then(res => res.json())
      .then(data => {
        L.geoJSON(data, {
          pointToLayer: (feature, latlng) =>
            L.circleMarker(latlng, {
              radius: 5,
              fillColor: "orange",
              fillOpacity: 0.8,
              color: "#000",
              weight: 1
            }).bindPopup(feature.properties.Business_Name)
        }).addTo(layerGroups.L2);
      });

fetch("L3.geojson")
      .then(res => res.json())
      .then(data => {
        L.geoJSON(data, {
          pointToLayer: (feature, latlng) =>
            L.circleMarker(latlng, {
              radius: 5,
              fillColor: "red",
              fillOpacity: 0.8,
              color: "#000",
              weight: 1
            }).bindPopup(feature.properties.Business_Name)
        }).addTo(layerGroups.L3);
      });

  fetch("shadowtransit.geojson")
      .then(res => res.json())
      .then(data => {
        L.geoJSON(data, {
          style: {
            color: "purple",
            weight: 2
          }
        }).addTo(layerGroups.vans);
      });
  
  
</script>

</body>
</html>
